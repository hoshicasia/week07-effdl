[supervisord]
nodaemon=true
#thanks to https://github.com/Supervisor/supervisor/issues/935

[program:http_server]
command=uvicorn toxic_server.http_server:app --host 0.0.0.0 --port 5000
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:grpc_server]
command=python -m toxic_server.grpc_server
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
